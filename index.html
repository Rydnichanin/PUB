<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b09"><meta name="description" content="Alley PUB — заказывайте пиццу, роллы, бургеры и напитки с доставкой"><title>Alley PUB — доставка еды</title>
<style>
:root{--bg:#080b09;--p:#111612;--p2:#171d18;--line:#29332c;--text:#f1f5f2;--muted:#9ba79e;--g:#45d483;--gold:#e6b84c;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:0 14px}.head{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#0a0e0b;z-index:5}.logo{font-size:20px;font-weight:900}.logo b{color:var(--g)}.actions{display:flex;gap:7px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:#061008;font-weight:800}.btn.alt{background:var(--p2);color:var(--text);border:1px solid var(--line)}.btn.gold{background:var(--gold)}.hero{text-align:center;padding:46px 0 30px}.hero h1{font-size:clamp(30px,6vw,52px);margin:0 0 10px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:16px}.venue{min-height:185px;display:flex;flex-direction:column;justify-content:space-between}.icon{font-size:40px}.section{padding:20px 0}.form{display:grid;gap:10px}.form label{font-weight:700}.form input,.form select,.form textarea{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#0b100d;color:var(--text)}.form textarea{min-height:75px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.box{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:16px;padding:17px}.mh{display:flex;justify-content:space-between;align-items:center}.x{background:none;color:var(--muted);border:0;font-size:25px}.menu{display:grid;gap:8px}.mi,.order{background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:12px}.mi{display:flex;justify-content:space-between;gap:10px;align-items:center}.qty{display:flex;gap:7px;align-items:center}.qty button{width:32px;height:32px;border:0;border-radius:8px;background:var(--line);color:var(--text)}.cart{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#152219;border:1px solid #2d6b47;padding:12px;border-radius:12px;margin-top:10px;position:sticky;bottom:8px}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tabs button{white-space:nowrap;background:var(--p2);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:9px 12px}.tabs button.on{color:var(--g);border-color:#2d6b47}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#202820;color:var(--gold);font-size:12px}.notice{background:#151b16;border:1px solid var(--line);padding:11px;border-radius:10px;margin-bottom:10px}.danger{color:var(--red)}footer{border-top:1px solid var(--line);padding:22px 0;margin-top:25px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding-top:30px}.head{height:60px}}
</style>
</head>
<body>
<header class="head"><div class="wrap" style="width:100%;display:flex;justify-content:space-between;align-items:center"><div class="logo">🍔 Alley <b>PUB</b></div><div class="actions" id="actions"></div></div></header>
<main id="app"></main><footer><div class="wrap">Alley PUB · вкусная еда с доставкой</div></footer>
<div class="modal" id="modal"><div class="box"><div class="mh"><h2 id="mt" style="margin:0"></h2><button class="x" onclick="closeModal()">×</button></div><div id="mb" style="margin-top:12px"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const cfg=window.firebaseConfig||null;let fb=null,db=null,auth=null,user=null,profile=null,orders=[],tariffs=[];let cart=[];const venues=[{id:'evgo',name:'EVGO',icon:'🍕',desc:'Пицца, бургеры и напитки',items:[['Пицца Пепперони',3500],['Пицца 4 сыра',3800],['Бургер EVGO',2800],['Картофель фри',900],['Кола',600]]},{id:'sushi',name:'Sushi Mix',icon:'🍣',desc:'Суши и роллы',items:[['Филадельфия',4200],['Калифорния',3800],['Сет классический',6500]]},{id:'pizza',name:'Pizza City',icon:'🍕',desc:'Пицца и закуски',items:[['Маргарита',3000],['Пепперони',3500],['Наггетсы',2200]]}];
function money(n){return Number(n||0).toLocaleString('ru-RU')+' ₸'}function modal(t,b){mt.textContent=t;mb.innerHTML=b;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function err(e){alert(e?.message||e)}
function calc(t){let d=+t.delivery||0,c=0,s=0;if(t.courierType==='percent')c=Math.round(d*(+t.courierValue||0)/100);else c=+t.courierValue||0;if(t.serviceType==='percent')s=Math.round(d*(+t.serviceValue||0)/100);else s=+t.serviceValue||0;return{delivery:d,courierPay:c,servicePay:s}}
function openLogin(){modal('Вход',`<form class=form onsubmit="login(event)"><label>Email<input name=email type=email required></label><label>Пароль<input name=password type=password required></label><button class=btn>Войти</button><p class=muted>Если аккаунта нет — зарегистрируйтесь как клиент.</p></form>`)}
function openRegister(){modal('Регистрация клиента',`<form class=form onsubmit="reg(event)"><label>Имя<input name=name required></label><label>Телефон<input name=phone></label><label>Email<input name=email type=email required></label><label>Пароль<input name=password type=password minlength=6 required></label><button class=btn>Создать аккаунт</button></form>`)}
async function login(e){e.preventDefault();try{await auth.signInWithEmailAndPassword(e.target.email.value,e.target.password.value);closeModal()}catch(x){err(x)}}
async function reg(e){e.preventDefault();try{const c=await auth.createUserWithEmailAndPassword(e.target.email.value,e.target.password.value);await c.user.updateProfile({displayName:e.target.name.value});await db.collection('users').doc(c.user.uid).set({uid:c.user.uid,name:e.target.name.value,phone:e.target.phone.value||'',email:e.target.email.value,role:'client',active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});closeModal()}catch(x){err(x)}}
async function logout(){await auth.signOut()}
function home(){return `<div class=wrap><section class=hero><h1>Доставка из любимых заведений</h1><p class=muted>Выбирайте заведение, собирайте заказ и оформляйте доставку.</p><button class=btn onclick="document.getElementById('venues').scrollIntoView({behavior:'smooth'})">Выбрать заведение</button></section><section class=section id=venues><h2>🏪 С нами сотрудничают</h2><div class=grid>${venues.map(v=>`<div class="card venue"><div><div class=icon>${v.icon}</div><h3>${v.name}</h3><div class=muted>${v.desc}</div></div><button class=btn onclick="openVenue('${v.id}')">Открыть меню</button></div>`).join('')}</div></section><section class=section><div class=card><h2>🚚 Как работает сервис</h2><div class=grid><div><b>1. Заказ</b><p class=muted>Клиент выбирает товары и тариф доставки.</p></div><div><b>2. Заведение</b><p class=muted>Принимает заказ и готовит его.</p></div><div><b>3. Курьер</b><p class=muted>Забирает и доставляет заказ.</p></div></div></div></section></div>`}
function openVenue(id){const v=venues.find(x=>x.id===id);cart=[];modal(v.name,`<div class=notice>${v.desc}</div><div class=menu>${v.items.map((x,i)=>`<div class=mi><div><b>${x[0]}</b><div class=muted>${money(x[1])}</div></div><div class=qty><button onclick="chg('${id}',${i},-1)">−</button><span id="q${i}">0</span><button onclick="chg('${id}',${i},1)">+</button></div></div>`).join('')}</div><div class=cart><b>Корзина: <span id=total>0 ₸</span></b><button class=btn onclick="checkout('${id}')">Оформить</button></div>`)}
function chg(id,i,d){let x=cart.find(x=>x.i===i);if(!x&&d>0){x={i,qty:0};cart.push(x)}if(x){x.qty=Math.max(0,x.qty+d);if(!x.qty)cart=cart.filter(y=>y!==x)}const v=venues.find(x=>x.id===id);cart.forEach(x=>{const el=document.getElementById('q'+x.i);if(el)el.textContent=x.qty});v.items.forEach((_,j)=>{if(!cart.some(x=>x.i===j)){const el=document.getElementById('q'+j);if(el)el.textContent=0}});total.textContent=money(cart.reduce((s,x)=>s+v.items[x.i][1]*x.qty,0))}
async function checkout(id){if(!cart.length)return alert('Добавьте товары');if(!user)return openLogin();if(!tariffs.length)await loadTariffs();const v=venues.find(x=>x.id===id),sum=cart.reduce((s,x)=>s+v.items[x.i][1]*x.qty,0);modal('Оформление заказа',`<form class=form onsubmit="makeOrder(event,'${id}',${sum})"><div class=notice>${v.name}<br>Товары: <b>${money(sum)}</b></div><label>Адрес доставки<input name=address required placeholder="Улица, дом, подъезд, квартира"></label><label>Телефон<input name=phone value="${profile?.phone||''}" required></label><label>Тариф<select name=tariff>${tariffs.filter(t=>t.active!==false).map((t,i)=>`<option value="${i}">${t.name} — ${money(t.delivery)}</option>`).join('')}</select></label><label>Оплата<select name=payment><option>Kaspi</option><option>Наличные</option></select></label><label>Комментарий<textarea name=comment></textarea></label><button class=btn>Подтвердить заказ</button></form>`)}
async function makeOrder(e,id,sum){e.preventDefault();try{const f=e.target,t=tariffs[+f.tariff.value],m=calc(t),v=venues.find(x=>x.id===id);if(m.courierPay+m.servicePay>m.delivery)throw Error('Ошибка тарифа: выплаты больше стоимости доставки');const items=cart.map(x=>({name:v.items[x.i][0],price:v.items[x.i][1],qty:x.qty}));await db.collection('orders').add({clientId:user.uid,clientName:profile.name||user.displayName||'',phone:f.phone.value,address:f.address.value,restaurantId:v.id,restaurant:v.name,items,amount:sum,payment:f.payment.value,comment:f.comment.value||'',status:'new',courierId:null,courierName:'Не назначен',tariffId:t.id,tariffName:t.name,delivery:m.delivery,courierPay:m.courierPay,servicePay:m.servicePay,tariffSnapshot:{name:t.name,delivery:m.delivery,courierType:t.courierType,courierValue:t.courierValue,serviceType:t.serviceType,serviceValue:t.serviceValue},createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});cart=[];closeModal();alert('Заказ создан');loadOrders();render()}catch(x){err(x)}}
function client(){return `<div class=wrap><section class=section><div class=card><h1>Личный кабинет</h1><p class=muted>${profile?.name||user.displayName||user.email} · Клиент</p><button class="btn alt" onclick="logout()">Выйти</button></div></section><section class=section><div class=card><h2>📦 Мои заказы</h2>${orders.length?orders.map(o=>`<div class=order><b>№ ${o.id.slice(0,7)}</b> <span class=status>${o.status}</span><p class=muted>${o.restaurant} · ${money(o.amount)} + доставка ${money(o.delivery)}<br>📍 ${o.address}<br>🚗 ${o.courierName||'Не назначен'}</p></div>`).join(''):'<p class=muted>Заказов пока нет.</p>'}</div></section></div>`}
function staff(){const r=profile.role;return `<div class=wrap><section class=section><div class=card><h1>${r==='admin'?'Администратор':r==='dispatcher'?'Диспетчер':r==='courier'?'Курьер':'Заведение'}</h1><p class=muted>${profile.name||user.email}</p><button class="btn alt" onclick="logout()">Выйти</button></div></section>${r==='admin'?admin():`<section class=section><div class=card><h2>📦 Заказы</h2><div id=staffOrders><p class=muted>Загрузка...</p></div></div></section>`}</div>`}
function admin(){return `<section class=section><div class=card><h2>⚙️ Настройки сервиса</h2><div class=tabs><button class=on onclick="adminOrders()">Заказы</button><button onclick="adminTariffs()">Тарифы</button></div><div id=adminPanel></div></div></section>`}
async function adminTariffs(){const p=document.getElementById('adminPanel');p.innerHTML=`<h3>Тарифы доставки</h3><button class=btn onclick="tariffForm()">+ Добавить тариф</button><div style="overflow:auto;margin-top:10px"><table class=table><tr><th>Название</th><th>Доставка</th><th>Курьер</th><th>Сервис</th><th>Действие</th></tr>${tariffs.map(t=>`<tr><td>${t.name}</td><td>${money(t.delivery)}</td><td>${t.courierType==='percent'?t.courierValue+'%':money(t.courierValue)}</td><td>${t.serviceType==='percent'?t.serviceValue+'%':money(t.serviceValue)}</td><td><button class="btn alt" onclick="tariffForm('${t.id}')">Изменить</button></td></tr>`).join('')}</table></div>`}
function tariffForm(id){const t=tariffs.find(x=>x.id===id)||{name:'',city:'Лисаковск',zone:'Город',delivery:1000,courierType:'fixed',courierValue:700,serviceType:'fixed',serviceValue:300,active:true};modal(id?'Изменить тариф':'Новый тариф',`<form class=form onsubmit="saveTariff(event,'${id||''}')"><label>Название<input name=name value="${t.name}" required></label><label>Город/зона<input name=zone value="${t.zone||''}"></label><label>Стоимость доставки<input name=delivery type=number min=0 value="${t.delivery}" required></label><label>Выплата курьеру<select name=ct><option value=fixed ${t.courierType==='fixed'?'selected':''}>Фиксированная сумма</option><option value=percent ${t.courierType==='percent'?'selected':''}>Процент</option></select></label><label>Значение курьера<input name=cv type=number min=0 value="${t.courierValue}" required></label><label>Доля сервиса<select name=st><option value=fixed ${t.serviceType==='fixed'?'selected':''}>Фиксированная сумма</option><option value=percent ${t.serviceType==='percent'?'selected':''}>Процент</option></select></label><label>Значение сервиса<input name=sv type=number min=0 value="${t.serviceValue}" required></label><label><input name=active type=checkbox ${t.active!==false?'checked':''}> Активен</label><button class=btn>Сохранить</button></form>`)}
async function saveTariff(e,id){e.preventDefault();try{const f=e.target,d={name:f.name.value,zone:f.zone.value,city:'Лисаковск',delivery:+f.delivery.value,courierType:f.ct.value,courierValue:+f.cv.value,serviceType:f.st.value,serviceValue:+f.sv.value,active:f.active.checked};const m=calc(d);if(m.courierPay+m.servicePay>m.delivery)throw Error('Выплаты курьеру и сервису не могут превышать доставку');if(id)await db.collection('tariffs').doc(id).set({...d,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});else await db.collection('tariffs').add({...d,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});closeModal();await loadTariffs();adminTariffs()}catch(x){err(x)}}
async function adminOrders(){const p=document.getElementById('adminPanel');p.innerHTML='<p class=muted>Загрузка заказов...</p>';const s=await db.collection('orders').orderBy('createdAt','desc').limit(100).get();const a=s.docs.map(d=>({id:d.id,...d.data()}));p.innerHTML=`<h3>Последние заказы</h3>${a.length?a.map(o=>`<div class=order><b>№ ${o.id.slice(0,7)}</b> · ${o.restaurant} · ${money(o.amount)} + ${money(o.delivery)} <span class=status>${o.status}</span><p class=muted>${o.clientName||''} · ${o.address}</p><div class=actions><button class=btn onclick="setStatus('${o.id}','accepted')">Принят</button><button class="btn gold" onclick="setStatus('${o.id}','ready')">Готов</button><button class="btn alt" onclick="setStatus('${o.id}','delivered')">Доставлен</button></div></div>`).join(''):'<p class=muted>Заказов нет.</p>'}`}
async function setStatus(id,status){try{await db.collection('orders').doc(id).update({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});adminOrders()}catch(x){err(x)}}
async function loadTariffs(){try{const s=await db.collection('tariffs').where('active','==',true).get();tariffs=s.docs.map(d=>({id:d.id,...d.data()}));if(!tariffs.length){await db.collection('tariffs').add({name:'По городу',city:'Лисаковск',zone:'Город',delivery:1200,courierType:'fixed',courierValue:800,serviceType:'fixed',serviceValue:400,active:true});await db.collection('tariffs').add({name:'За город',city:'Лисаковск',zone:'За город',delivery:2500,courierType:'percent',courierValue:65,serviceType:'percent',serviceValue:35,active:true});const s2=await db.collection('tariffs').where('active','==',true).get();tariffs=s2.docs.map(d=>({id:d.id,...d.data()}))}}catch(x){console.warn(x)}}
function loadOrders(){if(!user)return;return db.collection('orders').where('clientId','==',user.uid).orderBy('createdAt','desc').onSnapshot(s=>{orders=s.docs.map(d=>({id:d.id,...d.data()}));render()})}
function render(){actions.innerHTML=user?`<button class="btn alt" onclick="render()">Кабинет</button><button class="btn" onclick="logout()">Выйти</button>`:`<button class="btn alt" onclick="openLogin()">Войти</button><button class=btn onclick="openRegister()">Регистрация</button>`;app.innerHTML=!user?home():profile?.role==='client'?client():staff();if(user&&profile?.role==='admin'){adminOrders()}if(user&&profile&&profile.role!=='client'&&profile.role!=='admin'){loadStaffOrders()}}
async function loadStaffOrders(){const p=document.getElementById('staffOrders');if(!p)return;const s=await db.collection('orders').orderBy('createdAt','desc').limit(50).get();p.innerHTML=s.docs.map(d=>{const o={id:d.id,...d.data()};return `<div class=order><b>№ ${o.id.slice(0,7)}</b> · ${o.restaurant} <span class=status>${o.status}</span><p class=muted>${money(o.amount)} + доставка ${money(o.delivery)}<br>${o.address}</p><button class=btn onclick="setStatus('${o.id}','accepted')">Принять</button> <button class="btn gold" onclick="setStatus('${o.id}','ready')">Готов</button> <button class="btn alt" onclick="setStatus('${o.id}','delivered')">Доставлен</button></div>`}).join('')||'<p class=muted>Заказов нет.</p>'}
async function init(){try{fb=firebase.initializeApp(cfg);db=firebase.firestore();auth=firebase.auth();auth.onAuthStateChanged(async u=>{user=u;profile=u?(await db.collection('users').doc(u.uid).get()).data():null;if(user&&!profile){profile={uid:user.uid,name:user.displayName||'',role:'client',email:user.email,phone:'',active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()};await db.collection('users').doc(user.uid).set(profile,{merge:true});await db.collection('customerDirectory').doc(user.uid).set({uid:user.uid,name:profile.name,phone:'',createdAt:firebase.firestore.FieldValue.serverTimestamp(),orderCount:0},{merge:true})}if(user)await loadTariffs();render();if(user&&profile?.role==='client')loadOrders()})}catch(x){app.innerHTML='<div class="wrap section"><div class="card"><h2>Firebase не подключён</h2><p class=muted>Проверьте firebase-config.js и настройки Authentication/Firestore.</p></div></div>';console.error(x)}}
init();
</script><script src="alley-pub.js"></script></body></html>
